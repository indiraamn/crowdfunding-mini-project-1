<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BantuSesama</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <!-- HEADER -->
    <header>
        <div class="container">
            <h1 class="logo">Bantu<span>Sesama</span></h1>
        </div>
    </header>

    <!-- MAIN -->
    <main class="auth-wrapper">

        <!-- LOGIN -->
        <section class="auth-box">
            <h2>Login</h2>
            <p>Masukkan akun Anda untuk masuk</p>

            <form>
                <div class="form-group">
                    <label>Email / Username</label>
                    <input type="text" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" required>
                </div>

                <!-- Role (opsional tapi bagus) -->
                <div class="form-group">
                    <label>Masuk sebagai</label>
                    <select>
                        <option>Donatur</option>
                        <option>Pengelola Kampanye</option>
                    </select>
                </div>

                <a href="index.html" class="btn-submit">Masuk</a>
            </form>
        </section>

        <!-- REGISTER -->
        <section class="auth-box">
            <h2>Daftar Akun</h2>
            <p>Buat akun baru</p>

            <form>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" required>
                </div>

                <a href="login.html" class="btn-submit">Daftar</a>
            </form>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Sistem Crowdfunding Sosial</p>
        </div>
    </footer>

</body>
</html>
