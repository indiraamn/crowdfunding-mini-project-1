<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar - BantuSesama</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body class="auth-page">
    <header>
        <div class="container">
            <div class="logo"><h1>Bantu<span>Sesama</span></h1></div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-box">
            <h2>Daftar Akun</h2>
            <p>Lengkapi data untuk membuat akun baru</p>
            <form>
                <div class="input-group">
                    <label>Nama Lengkap</label>
                    <input type="text" placeholder="Nama Lengkap" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="email@contoh.com" required>
                </div>
                <div class="input-group">
                    <label>Password Baru</label>
                    <input type="password" placeholder="Minimal 8 karakter" required>
                </div>
                
                <a href="login.html" class="btn-primary-link">Selesaikan Pendaftaran</a>
                
                <div class="auth-footer">
                    <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2026 Sistem Crowdfunding Sosial. Mini Project Praktikum Web.</p>
                <div class="footer-links">
                    <small>Dibuat dengan Prinsip IMK - BantuSesama</small>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
